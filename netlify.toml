# Netlify deploy: Next.js pages and /api routes via Netlify's Next.js runtime (OpenNext).
# ČSÚ importer is deliberately not deployed or scheduled to avoid background invocations.
# Required environment variables (Site configuration → Environment variables):
#   TEAM_PASSWORD, SESSION_SECRET, MANUAL_ENTRIES_DATABASE_URL, OFFICIAL_RESULTS_DATABASE_URL

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
